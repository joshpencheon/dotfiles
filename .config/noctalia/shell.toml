[shell]
polkit_agent = true

    [shell.animation]
    enabled = false

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    categories = false

    [shell.panel]
    clipboard_position = "auto"
    control_center_placement = "floating"
    floating_offset = 7
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_wallpaper = true
    transparency_mode = "glass"
    wallpaper_placement = "floating"
    open_near_click_session = true
    session_placement = "floating"
    session_position = "top_left"

    [shell.screen_corners]
    enabled = true
    size = 28

    [shell.session]
    grid = true
    grid_columns = 1
    show_shortcuts = false

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        glyph = "lock"
        label = "Sleep"
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 2.0
        enabled = true
        shortcut = "4"
        variant = "secondary"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 2.0
        enabled = true
        shortcut = "5"
        variant = "destructive"
